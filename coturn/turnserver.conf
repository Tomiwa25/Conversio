# Coturn STUN & TURN Configuration for Conversio
listening-port=3478
tls-listening-port=5349

realm=conversio.local
server-name=conversio-turn

# Long-term credential mechanism for ephemeral WebRTC tokens
lt-cred-mech
user=conversio_user:conversio_secret_password

# Relay IP & port range
min-port=49152
max-port=65535

# Fingerprint in TURN messages
fingerprint

# Verbose logging in development
verbose

