<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-2" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="link-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F2A9" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00F2A9" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="shadow-2" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="300" rx="16" fill="url(#bg-grad-2)"/>
  <rect width="480" height="300" rx="16" stroke="rgba(237,237,232,0.08)" stroke-width="1"/>

  <!-- Top Share Link Pill Bar -->
  <g filter="url(#shadow-2)">
    <rect x="44" y="24" width="392" height="48" rx="10" fill="#0E121A" stroke="rgba(237,237,232,0.15)" stroke-width="1"/>
    
    <!-- Link Icon -->
    <rect x="56" y="34" width="28" height="28" rx="6" fill="rgba(0,242,169,0.1)"/>
    <path d="M68 44a3 3 0 014.2 0l1.6 1.6a3 3 0 010 4.2l-2.4 2.4a3 3 0 01-4.2 0M72 48l-4 4" stroke="#00F2A9" stroke-width="1.8" stroke-linecap="round"/>

    <!-- URL Display -->
    <text x="94" y="52" fill="#EDEDE8" font-family="monospace" font-size="12" font-weight="500">conversio.io/room/team-call</text>

    <!-- Copy Button Action -->
    <rect x="328" y="32" width="98" height="32" rx="6" fill="#00F2A9"/>
    <path d="M342 48l3 3 6-6" stroke="#07090D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="358" y="52" fill="#07090D" font-family="system-ui, sans-serif" font-size="11" font-weight="700">COPIED!</text>
  </g>

  <!-- Connection Distribution Beams -->
  <path d="M240 72v30M240 102l-130 30M240 102l130 30" stroke="url(#link-beam)" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Device 1: Laptop (Left) -->
  <g id="device-laptop">
    <!-- Screen -->
    <rect x="36" y="138" width="130" height="84" rx="6" fill="#07090D" stroke="rgba(237,237,232,0.2)" stroke-width="1.5"/>
    <rect x="40" y="142" width="122" height="72" rx="3" fill="#0E121A"/>
    <!-- Video Tiles Mockup -->
    <rect x="44" y="146" width="54" height="32" rx="3" fill="#1E293B"/>
    <circle cx="71" cy="158" r="6" fill="#00F2A9" opacity="0.6"/>
    <rect x="102" y="146" width="56" height="32" rx="3" fill="#1E293B"/>
    <circle cx="130" cy="158" r="6" fill="#38BDF8" opacity="0.6"/>
    <rect x="44" y="181" width="54" height="30" rx="3" fill="#1E293B"/>
    <circle cx="71" cy="193" r="6" fill="#F59E0B" opacity="0.6"/>
    <rect x="102" y="181" width="56" height="30" rx="3" fill="#1E293B" stroke="#00F2A9" stroke-width="1"/>
    <circle cx="130" cy="193" r="6" fill="#A855F7" opacity="0.6"/>
    <!-- Laptop Base -->
    <path d="M26 222h150l-10 6H36l-10-6z" fill="#334155"/>
    <text x="82" y="244" fill="#8A909E" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">ON LAPTOP</text>
  </g>

  <!-- Device 2: Tablet (Center) -->
  <g id="device-tablet">
    <!-- Body -->
    <rect x="188" y="126" width="104" height="110" rx="8" fill="#07090D" stroke="rgba(237,237,232,0.2)" stroke-width="1.5"/>
    <rect x="193" y="131" width="94" height="96" rx="4" fill="#0E121A"/>
    <!-- Screen contents: Split Video + Chat -->
    <rect x="197" y="135" width="86" height="50" rx="3" fill="#1E293B"/>
    <circle cx="240" cy="156" r="10" fill="#00F2A9" opacity="0.7"/>
    <path d="M240 152v8m-4-4h8" stroke="#07090D" stroke-width="2" stroke-linecap="round"/>
    <rect x="197" y="189" width="86" height="32" rx="3" fill="#07090D" stroke="rgba(237,237,232,0.08)" stroke-width="1"/>
    <rect x="201" y="194" width="46" height="4" rx="2" fill="#8A909E"/>
    <rect x="201" y="202" width="68" height="4" rx="2" fill="#00F2A9" opacity="0.8"/>
    <text x="224" y="254" fill="#8A909E" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">ON TABLET</text>
  </g>

  <!-- Device 3: Smartphone (Right) -->
  <g id="device-mobile">
    <!-- Phone Body -->
    <rect x="328" y="132" width="64" height="110" rx="10" fill="#07090D" stroke="rgba(237,237,232,0.2)" stroke-width="1.5"/>
    <rect x="332" y="136" width="56" height="98" rx="6" fill="#0E121A"/>
    <!-- Top Notch -->
    <rect x="348" y="138" width="24" height="3" rx="1.5" fill="#334155"/>
    <!-- Video Stream -->
    <rect x="336" y="145" width="48" height="58" rx="4" fill="#1E293B" stroke="#00F2A9" stroke-width="1"/>
    <circle cx="360" cy="170" r="10" fill="#00F2A9" opacity="0.7"/>
    <!-- Mobile Controls -->
    <circle cx="344" cy="216" r="5" fill="#FF4D4D"/>
    <circle cx="360" cy="216" r="5" fill="#334155"/>
    <circle cx="376" cy="216" r="5" fill="#00F2A9"/>
    <text x="342" y="260" fill="#8A909E" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">ON PHONE</text>
  </g>

  <!-- Bottom Callout Badge -->
  <rect x="140" y="270" width="200" height="20" rx="10" fill="rgba(0,242,169,0.08)" stroke="rgba(0,242,169,0.2)" stroke-width="1"/>
  <text x="148" y="284" fill="#00F2A9" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">NO APPS OR DOWNLOADS NEEDED</text>
</svg>
