<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" fill="none" class="w-full h-auto">
  <defs>
    <linearGradient id="bg-grad-1" x1="0" y1="0" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E121A"/>
      <stop offset="100%" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="signal-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00F2A9"/>
      <stop offset="100%" stop-color="#00B37E"/>
    </linearGradient>
    <filter id="shadow-1" x="-10%" y="-10%" width="120%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="480" height="300" rx="16" fill="url(#bg-grad-1)"/>
  <rect width="480" height="300" rx="16" stroke="rgba(237,237,232,0.08)" stroke-width="1"/>

  <!-- Subtle Matrix Grid Dots -->
  <g opacity="0.15">
    <circle cx="40" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="80" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="120" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="360" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="400" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="440" cy="40" r="1" fill="#EDEDE8"/>
    <circle cx="40" cy="240" r="1" fill="#EDEDE8"/>
    <circle cx="440" cy="240" r="1" fill="#EDEDE8"/>
  </g>

  <!-- Central Glass Form Console -->
  <g filter="url(#shadow-1)">
    <rect x="50" y="32" width="380" height="236" rx="12" fill="#0E121A" stroke="rgba(237,237,232,0.12)" stroke-width="1"/>

    <!-- Window Header -->
    <rect x="50" y="32" width="380" height="36" rx="12" fill="#07090D" opacity="0.8"/>
    <path d="M50 68h380" stroke="rgba(237,237,232,0.08)" stroke-width="1"/>
    
    <!-- Window Controls -->
    <circle cx="72" cy="50" r="4" fill="#FF4D4D" opacity="0.8"/>
    <circle cx="86" cy="50" r="4" fill="#FFB74D" opacity="0.8"/>
    <circle cx="100" cy="50" r="4" fill="#00F2A9" opacity="0.8"/>

    <!-- Header Title & Telemetry -->
    <text x="120" y="54" fill="#EDEDE8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.02em">START A MEETING</text>
    <rect x="330" y="42" width="86" height="16" rx="8" fill="rgba(0,242,169,0.1)" stroke="rgba(0,242,169,0.25)" stroke-width="1"/>
    <circle cx="340" cy="50" r="2.5" fill="#00F2A9"/>
    <text x="350" y="53" fill="#00F2A9" font-family="monospace" font-size="8.5" font-weight="700">READY</text>

    <!-- Field 1: Meeting Title -->
    <text x="72" y="92" fill="#8A909E" font-family="system-ui, sans-serif" font-size="10" font-weight="500">MEETING NAME</text>
    <rect x="72" y="100" width="336" height="32" rx="6" fill="#07090D" stroke="#00F2A9" stroke-width="1"/>
    <text x="86" y="120" fill="#EDEDE8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Weekly Team Catch-up</text>
    <rect x="235" y="108" width="2" height="16" fill="#00F2A9"/>

    <!-- Field 2: Your Name & Password Split -->
    <text x="72" y="152" fill="#8A909E" font-family="system-ui, sans-serif" font-size="10" font-weight="500">YOUR NAME</text>
    <rect x="72" y="160" width="160" height="32" rx="6" fill="#07090D" stroke="rgba(237,237,232,0.12)" stroke-width="1"/>
    <text x="86" y="180" fill="#EDEDE8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500">Muhydeen</text>

    <text x="248" y="152" fill="#8A909E" font-family="system-ui, sans-serif" font-size="10" font-weight="500">PASSWORD (OPTIONAL)</text>
    <rect x="248" y="160" width="160" height="32" rx="6" fill="#07090D" stroke="rgba(237,237,232,0.12)" stroke-width="1"/>
    <circle cx="264" cy="176" r="3" fill="#EDEDE8"/>
    <circle cx="276" cy="176" r="3" fill="#EDEDE8"/>
    <circle cx="288" cy="176" r="3" fill="#EDEDE8"/>
    <circle cx="300" cy="176" r="3" fill="#EDEDE8"/>
    <circle cx="312" cy="176" r="3" fill="#EDEDE8"/>
    <circle cx="324" cy="176" r="3" fill="#EDEDE8"/>
    <rect x="358" y="166" width="42" height="20" rx="4" fill="rgba(255,183,77,0.12)" stroke="rgba(255,183,77,0.3)" stroke-width="1"/>
    <text x="364" y="180" fill="#FFB74D" font-family="system-ui, sans-serif" font-size="9" font-weight="600">SAFE</text>

    <!-- Action Button -->
    <rect x="72" y="208" width="336" height="38" rx="6" fill="url(#signal-glow)"/>
    <text x="180" y="232" fill="#07090D" font-family="system-ui, sans-serif" font-size="12" font-weight="700" letter-spacing="0.02em">START MEETING →</text>
  </g>
</svg>
