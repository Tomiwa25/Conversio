<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none" class="w-full h-auto max-w-[320px] mx-auto">
  <!-- Subtle floor shadow -->
  <ellipse cx="200" cy="226" rx="140" ry="8" fill="#e2e8f0" opacity="0.6"/>

  <!-- Center: Video Conference Monitor -->
  <g id="monitor">
    <!-- Monitor Stand -->
    <rect x="194" y="160" width="12" height="30" rx="3" fill="#64748b"/>
    <ellipse cx="200" cy="190" rx="32" ry="5" fill="#475569"/>

    <!-- Monitor Outer Bezel -->
    <rect x="100" y="36" width="200" height="128" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="3"/>
    
    <!-- Screen Glass -->
    <rect x="106" y="42" width="188" height="116" rx="6" fill="#1e293b"/>

    <!-- Top Web Camera Dot -->
    <circle cx="200" cy="39" r="2" fill="#38bdf8"/>

    <!-- Video Grid: 6 Participant Windows -->
    <!-- Row 1 -->
    <g id="tiles-row-1">
      <!-- Tile 1 -->
      <rect x="110" y="46" width="58" height="52" rx="4" fill="#0284c7"/>
      <circle cx="139" cy="62" r="9" fill="#e0f2fe"/>
      <path d="M125 88c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#e0f2fe"/>

      <!-- Tile 2 -->
      <rect x="171" y="46" width="58" height="52" rx="4" fill="#0369a1"/>
      <circle cx="200" cy="62" r="9" fill="#bae6fd"/>
      <path d="M186 88c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#bae6fd"/>

      <!-- Tile 3 -->
      <rect x="232" y="46" width="58" height="52" rx="4" fill="#0284c7"/>
      <circle cx="261" cy="62" r="9" fill="#e0f2fe"/>
      <path d="M247 88c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#e0f2fe"/>
    </g>

    <!-- Row 2 -->
    <g id="tiles-row-2">
      <!-- Tile 4 -->
      <rect x="110" y="101" width="58" height="52" rx="4" fill="#0369a1"/>
      <circle cx="139" cy="117" r="9" fill="#bae6fd"/>
      <path d="M125 143c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#bae6fd"/>

      <!-- Tile 5 (Active Speaker with green outline) -->
      <rect x="171" y="101" width="58" height="52" rx="4" fill="#0284c7" stroke="#10b981" stroke-width="2"/>
      <circle cx="200" cy="117" r="9" fill="#e0f2fe"/>
      <path d="M186 143c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#e0f2fe"/>
      <!-- Small mic badge -->
      <circle cx="221" cy="145" r="4" fill="#10b981"/>

      <!-- Tile 6 -->
      <rect x="232" y="101" width="58" height="52" rx="4" fill="#0369a1"/>
      <circle cx="261" cy="117" r="9" fill="#bae6fd"/>
      <path d="M247 143c0-7.7 6.3-14 14-14s14 6.3 14 14" fill="#bae6fd"/>
    </g>
  </g>

  <!-- Left Character: Person with Pink Shirt & Blue Pants holding a tablet -->
  <g id="character-left">
    <!-- Legs -->
    <path d="M112 165l-4 54h6l5-54h-7z" fill="#0284c7"/>
    <path d="M123 165l2 54h6l0-54h-8z" fill="#0369a1"/>
    <!-- Shoes -->
    <path d="M104 219h14v4h-14z" fill="#334155"/>
    <path d="M124 219h14v4h-14z" fill="#334155"/>
    <!-- Torso / Shirt (Pink/Coral) -->
    <rect x="108" y="125" width="22" height="42" rx="4" fill="#f472b6"/>
    <!-- Head -->
    <circle cx="119" cy="110" r="9" fill="#fdba74"/>
    <!-- Hair -->
    <path d="M110 108c0-5 4-9 9-9s9 4 9 9v2h-18v-2z" fill="#7c2d12"/>
    <!-- Left Arm & Tablet -->
    <path d="M108 132l-14 18 3 4 14-16z" fill="#f472b6"/>
    <rect x="86" y="146" width="18" height="24" rx="2" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-15 95 158)"/>
    <!-- Right Arm -->
    <path d="M130 132l8 16-3 4-8-14z" fill="#f472b6"/>
  </g>

  <!-- Right Character: Person in Teal reaching up to the monitor -->
  <g id="character-right">
    <!-- Legs -->
    <path d="M272 158l-3 60h6l4-60h-7z" fill="#0f172a"/>
    <path d="M283 158l6 60h6l-3-60h-9z" fill="#1e293b"/>
    <!-- Shoes -->
    <path d="M265 218h14v4h-14z" fill="#475569"/>
    <path d="M289 218h14v4h-14z" fill="#475569"/>
    <!-- Torso (Teal/Emerald shirt) -->
    <path d="M268 116l14-6 12 10-6 40h-20z" fill="#10b981"/>
    <!-- Head -->
    <circle cx="288" cy="98" r="9" fill="#fbcfe8"/>
    <!-- Hair (bun) -->
    <path d="M279 97c0-6 5-11 11-11s11 5 11 11c0 2-1 4-3 5h-16c-2-1-3-3-3-5z" fill="#1e293b"/>
    <circle cx="298" cy="85" r="4" fill="#1e293b"/>
    <!-- Left Arm Reaching up to monitor -->
    <path d="M272 120l-26-44 5-3 26 40z" fill="#10b981"/>
    <circle cx="248" cy="74" r="4" fill="#fbcfe8"/>
    <!-- Right Arm on waist -->
    <path d="M294 120l12 16-4 4-12-14z" fill="#10b981"/>
  </g>
</svg>
